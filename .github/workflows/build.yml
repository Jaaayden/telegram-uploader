name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly vulnerability scan: advisories appear without any code change.
    - cron: '17 3 * * 1'

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless. Runs on
# main and on tags are never cancelled: each one publishes a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # go.mod pins the minimum (1.26.0); build with the newest 1.26.x patch so
  # standard-library security fixes reach CI and the shipped binaries.
  GO_VERSION: '1.26.x'

jobs:
  verify:
    name: Lint and test (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          # Cached below with restore-keys: setup-go's own cache is keyed on
          # go.sum alone, so every dependency update would start cold.
          cache: false

      - name: Restore Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-verify-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-verify-

      - name: Check version, formatting and modules
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./scripts/check-version.sh "$GITHUB_REF_NAME"
          else
            ./scripts/check-version.sh
          fi
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go mod verify
          go mod tidy -diff

      # Every package builds without a C toolchain on Linux (the window has a
      # stub there), so the whole module is vetted and race-tested here. The
      # Windows build is pure Go too and is vetted by cross-compiling.
      - name: Vet (Linux and Windows)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Race tests
        run: go test -race ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  vulncheck:
    name: Vulnerability scan
    # Not required for publishing: new advisories must not block a release,
    # but they should be visible on every run and weekly.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false

      - name: Restore Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-vuln-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-vuln-

      # The shipped platforms are scanned from Linux: both analyses are pure
      # Go (the macOS window shim is excluded without cgo and has a stub).
      - name: govulncheck (Windows and macOS code paths)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 govulncheck ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 govulncheck ./...

  macos:
    name: macOS (arm64 and x86_64)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false

      - name: Restore Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-build-

      - name: Run vet and tests
        run: |
          go vet ./...
          go test ./...

      - name: Compute build version
        id: version
        run: |
          base="$(./scripts/version.sh)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=$base" >> "$GITHUB_OUTPUT"
          else
            echo "value=${base}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Both architectures are built on the one Apple-silicon runner; the
      # Intel build only needs clang's -arch flag.
      - name: Build and package both architectures
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
          BUILD_COMMIT: ${{ github.sha }}
          SKIP_TESTS: '1'
        run: |
          GOARCH=arm64 ARCHIVE=TelegramVideoUploader-macos-arm64.zip ./scripts/build.sh
          GOARCH=amd64 ARCHIVE=TelegramVideoUploader-macos-x86_64.zip ./scripts/build.sh
          ls -l build/*.zip
          # Size budget: the archives are about 6-7 MB. A jump past 12 MB means
          # a dependency defeated dead-code elimination or assets crept in.
          for archive in build/*.zip; do
            size="$(stat -f %z "$archive")"
            if (( size > 12 * 1024 * 1024 )); then
              echo "$archive is $size bytes, over the 12 MB budget" >&2
              exit 1
            fi
          done

      # Opens the real window in demo mode and checks that the interface
      # loads and talks to Go in both directions.
      - name: Smoke-test the packaged application
        timeout-minutes: 3
        run: |
          build/arm64/TelegramVideoUploader.app/Contents/MacOS/TelegramVideoUploader --version
          build/arm64/TelegramVideoUploader.app/Contents/MacOS/TelegramVideoUploader --smoke

      - name: Upload application artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TelegramVideoUploader-macos
          path: build/TelegramVideoUploader-macos-*.zip
          if-no-files-found: error

  windows:
    name: Windows amd64
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Pure Go: no C compiler, no cgo build of a GUI toolkit.
      CGO_ENABLED: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false

      - name: Restore Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\go\pkg\mod
            ~\AppData\Local\go-build
          key: go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-build-

      - name: Run vet and tests
        run: |
          go vet ./...
          go test ./...

      - name: Build application
        shell: bash
        env:
          BUILD_COMMIT: ${{ github.sha }}
          SKIP_TESTS: '1'
          OUTPUT: build/TelegramVideoUploader-windows-amd64.exe
        run: |
          base="$(./scripts/version.sh)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export BUILD_VERSION="$base"
          else
            export BUILD_VERSION="${base}-dev.${GITHUB_SHA::7}"
          fi
          pwsh -File scripts/build.ps1
          ls -l build/
          # Size budget: the executable is about 20 MB. A jump past 30 MB means
          # a dependency defeated dead-code elimination or assets crept in.
          size="$(stat -c %s "$OUTPUT")"
          if (( size > 30 * 1024 * 1024 )); then
            echo "$OUTPUT is $size bytes, over the 30 MB budget" >&2
            exit 1
          fi

      # Opens the real window (WebView2) in demo mode and checks that the
      # interface loads and talks to Go in both directions.
      - name: Smoke-test the application
        timeout-minutes: 3
        shell: pwsh
        run: |
          $process = Start-Process -FilePath build\TelegramVideoUploader-windows-amd64.exe -ArgumentList '--smoke' -Wait -PassThru
          Write-Host "smoke exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { exit 1 }

      - name: Upload application artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TelegramVideoUploader-windows-amd64
          path: build/TelegramVideoUploader-windows-amd64.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [verify, macos, windows]
    if: >-
      success() &&
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      # The in-app updater looks these names up and verifies them against
      # SHA256SUMS; do not rename them.
      - name: Verify release assets and generate checksums
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          test -f TelegramVideoUploader-macos-arm64.zip
          test -f TelegramVideoUploader-macos-x86_64.zip
          test -f TelegramVideoUploader-windows-amd64.exe
          sha256sum TelegramVideoUploader-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # One rolling prerelease instead of a new permanent release per push.
            tag="nightly"
            title="Nightly build (${GITHUB_SHA:0:12})"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
            gh release create "$tag" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "Automated build from main commit ${GITHUB_SHA}. Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --prerelease \
              --latest=false
          else
            tag="$GITHUB_REF_NAME"
            title="Telegram Video Uploader ${GITHUB_REF_NAME}"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists; nothing to publish."
              exit 0
            fi
            gh release create "$tag" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --generate-notes \
              --latest
          fi
