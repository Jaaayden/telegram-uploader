name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly vulnerability scan: advisories appear without any code change.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  verify:
    name: Lint and test (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod pins the minimum (1.26.0); build with the newest 1.26.x patch
          # so standard-library security fixes reach CI and the shipped binaries.
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Check version consistency
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./scripts/check-version.sh "$GITHUB_REF_NAME"
          else
            ./scripts/check-version.sh
          fi

      - name: Check formatting and modules
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go mod verify
          go mod tidy -diff

      # The Fyne UI needs a C toolchain and GL headers, so the headless
      # packages are checked here and the UI is vetted and tested on the
      # native macOS/Windows builds below.
      - name: Vet, race-test and staticcheck headless packages
        shell: bash
        run: |
          pkgs="$(go list ./... | grep -v -e '/internal/ui$' -e '/cmd/tg-video-uploader$')"
          go vet $pkgs
          go test -race $pkgs
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 $pkgs

  vulncheck:
    name: Vulnerability scan
    # Not required for publishing: new advisories must not block a release,
    # but they should be visible on every run and weekly.
    runs-on: macos-15
    env:
      CGO_ENABLED: 1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod pins the minimum (1.26.0); build with the newest 1.26.x patch
          # so standard-library security fixes reach CI and the shipped binaries.
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test-and-build:
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      CGO_CFLAGS: ${{ matrix.cgo_cflags }}
      CGO_CXXFLAGS: ${{ matrix.cgo_cflags }}
      CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            artifact: TelegramVideoUploader-macos-arm64
            extension: ""
            ldflags: -s -w
            upload: build/TelegramVideoUploader-macos-arm64.zip
            deployment_target: '11.0'
            cgo_cflags: -O2 -g -mmacosx-version-min=11.0
            cgo_ldflags: -mmacosx-version-min=11.0
          - name: macOS x86_64
            os: macos-15-intel
            artifact: TelegramVideoUploader-macos-x86_64
            extension: ""
            ldflags: -s -w
            upload: build/TelegramVideoUploader-macos-x86_64.zip
            deployment_target: '11.0'
            cgo_cflags: -O2 -g -mmacosx-version-min=11.0
            cgo_ldflags: -mmacosx-version-min=11.0
          - name: Windows amd64
            os: windows-latest
            artifact: TelegramVideoUploader-windows-amd64
            extension: .exe
            ldflags: -s -w -H=windowsgui
            upload: build/TelegramVideoUploader-windows-amd64.exe
            deployment_target: ""
            cgo_cflags: -O2 -g
            cgo_ldflags: ""

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod pins the minimum (1.26.0); build with the newest 1.26.x patch
          # so standard-library security fixes reach CI and the shipped binaries.
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check native C compiler
        shell: bash
        run: gcc --version

      - name: Run vet and tests
        run: |
          go vet ./...
          go test ./...

      - name: Compute build version
        id: version
        shell: bash
        run: |
          base="$(./scripts/version.sh)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$base"
          else
            version="${base}-dev.${GITHUB_SHA::7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build standalone application
        shell: bash
        env:
          OUTPUT: build/${{ matrix.artifact }}${{ matrix.extension }}
          LDFLAGS: ${{ matrix.ldflags }} -X github.com/Jaaayden/telegram-uploader/internal/buildinfo.Version=${{ steps.version.outputs.value }}
        run: |
          mkdir -p build
          go build -trimpath -ldflags="$LDFLAGS" -o "$OUTPUT" ./cmd/tg-video-uploader

      - name: Package macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          BINARY: build/${{ matrix.artifact }}
          ARCHIVE: build/${{ matrix.artifact }}.zip
        run: |
          APP_BUNDLE="build/TelegramVideoUploader.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          cp "$BINARY" "$APP_BUNDLE/Contents/MacOS/TelegramVideoUploader"
          cp packaging/macos/Info.plist "$APP_BUNDLE/Contents/Info.plist"
          cp packaging/macos/AppIcon.icns "$APP_BUNDLE/Contents/Resources/AppIcon.icns"
          plutil -lint "$APP_BUNDLE/Contents/Info.plist"
          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict "$APP_BUNDLE"
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "$ARCHIVE"

      - name: Upload application artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [verify, test-and-build]
    if: >-
      success() &&
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and generate checksums
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          test -f TelegramVideoUploader-macos-arm64.zip
          test -f TelegramVideoUploader-macos-x86_64.zip
          test -f TelegramVideoUploader-windows-amd64.exe
          sha256sum TelegramVideoUploader-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # One rolling prerelease instead of a new permanent release per push.
            tag="nightly"
            title="Nightly build (${GITHUB_SHA:0:12})"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
            gh release create "$tag" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "Automated build from main commit ${GITHUB_SHA}. Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --prerelease \
              --latest=false
          else
            tag="$GITHUB_REF_NAME"
            title="Telegram Video Uploader ${GITHUB_REF_NAME}"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists; nothing to publish."
              exit 0
            fi
            gh release create "$tag" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --generate-notes \
              --latest
          fi
